<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shooting Star Video</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: black;
  overflow: hidden;
}

/* 🎥 VIDEO STYLE (kayak contoh kamu) */
video {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 80%;
  border-radius: 20px;
  box-shadow: 0 0 30px rgba(59, 222, 247, 0.8);
  z-index: 5;
}

/* 🌌 STAR BACKGROUND */
.stars {
  position: absolute;
  width: 100%;
  height: 100%;
  overflow: hidden;
  pointer-events: none;
  z-index: 1;
}

/* ⭐ SHOOTING STAR (tambahan dari punyamu) */
.shooting-star-blue {
  position: absolute;
  width: 200px;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgb(25, 172, 225));
  border-radius: 999px;
  top: var(--top);
  left: var(--left);
  transform: rotate(135deg);
  animation: shoot 2s linear infinite;
  z-index: 2;
  opacity: 0;
}

.shooting-star-purple {
  position: absolute;
  width: 200px;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgb(175, 25, 225));
  border-radius: 999px;
  top: var(--top);
  left: var(--left);
  transform: rotate(135deg);
  animation: shoot 2s linear infinite;
  z-index: 2;
  opacity: 0;
}

.shooting-star-green {
  position: absolute;
  width: 200px;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgb(38, 217, 122));
  border-radius: 999px;
  top: var(--top);
  left: var(--left);
  transform: rotate(135deg);
  animation: shoot 2s linear infinite;
  z-index: 2;
  opacity: 0;
}

@keyframes shoot {
  0% { opacity: 0; transform: rotate(135deg) translateX(0); }
  10% { opacity: 1; }
  100% { opacity: 0; transform: rotate(135deg) translateX(200vw); }
}

/* 🖼️ IMAGE CHARACTER */
.cinna-top-left {
  position: absolute;
  width: 180px;
  bottom: 20px;
  right: 20px;
  animation: float 1.5s ease-in-out infinite alternate;
  Z-index: 10;
}

.cinna-bottom-right {
  position: absolute;
  width: 220px;
  top: 20px;
  left: 20px;
  animation: float 1.5s ease-in-out infinite alternate;
  z-index: 10;
}

@keyframes float {
  from { transform: translateY(0); }
  to { transform: translateY(-15px); }
}
</style>
</head>

<body>

<!-- 🎥 VIDEO -->
<video loop autoplay muted controls>
  <source src="APA.mp4" type="video/mp4">
</video>

<!-- 🌌 STAR BACKGROUND -->
<div class="stars"></div>

<!-- ⭐ SHOOTING STARS -->
<div class="shooting-star-blue" style="--top:20%; --left:10%;"></div>
<div class="shooting-star-purple" style="--top:50%; --left:30%; animation-delay:1s;"></div>
<div class="shooting-star-green" style="--top:70%; --left:60%; animation-delay:2s;"></div>

<!-- 🖼️ IMAGE -->
<img src="cinna.png" class="cinna-top-left">
<img src="cinna.png" class="cinna-bottom-right">

</body>
</html>
